[package]
name = "cfn-guard"
version = "3.2.1"
edition = "2018"
authors = ["Diwakar Chakravarthy", "John Tompkins", "Omkar Hegde", "Priya Padmanaban",
    "Bryan Ayala", "Kexiang Wang", "Akshay Rane", "Tyler Southwick", "Josh Fried", "aws-cloudformation-developers <aws-cloudformation-developers@amazon.com>"]
description = "AWS CloudFormation Guard is an open-source general-purpose policy-as-code evaluation tool. It provides developers with a simple-to-use, yet powerful and expressive domain-specific language (DSL) to define policies and enables developers to validate JSON- or YAML- formatted structured data with those policies."
license = "Apache-2.0"
repository = "https://github.com/aws-cloudformation/cloudformation-guard"
documentation = "https://github.com/aws-cloudformation/cloudformation-guard/blob/main/README.md"
readme = "README.md"
keywords = ["policy-as-code", "guard", "cfn-guard", "security", "compliance"]

[lib]
name = "cfn_guard"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
guard-lang = { package = "cloudformation-guard-lang", version = "3.2.1", path = "../guard-lang", features = ["junit"] }
nom = "7.0.0"
indexmap = { version = "1.6.0", features = ["serde-1"] }
clap_complete = "4.1.2"
clap = { version = "4.5.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_yaml = "0.9.10"
walkdir = "2.3.1"
colored = "2.2.0"
# The SARIF reporter URL-encodes artifact location segments.
urlencoding = "2.1.0"
heck = "0.3.1"
lazy_static = "1.4.0"
itertools = "0.4.7"
string-builder = "0.2.0"
enumflags2 = "0.7.7"
enumflags2_derive = "0.7.7"
rstest = "0.24.0"
fancy-regex = "0.13.0"
indoc = "1.0.8"
quick-xml = "0.30.0"
wasm-bindgen = "0.2.92"

[dev-dependencies]
pretty_assertions = "1.4.0"
# The tests compare evaluator records; the `testing` feature compiles the record types' equality,
# which the library withholds from ordinary consumers.
guard-lang = { package = "cloudformation-guard-lang", version = "3.2.1", path = "../guard-lang", features = ["testing"] }
# The docs citation checker in the integration tests reads this crate's sources as Rust, not as text.
syn = { version = "2.0.98", features = ["full", "visit"] }
proc-macro2 = { version = "1.0.93", features = ["span-locations"] }

[dependencies.serde_json]
version = "1.0.85"
# `unbounded_depth` lets the JSON shape check in `rules::values` run without serde_json's own
# recursion limit of 128, which sat below the loader's nesting bound; the loader enforces depth.
features = ["preserve_order", "unbounded_depth"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
