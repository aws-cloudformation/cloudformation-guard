# The two resources of metadata-maps-authentication-and-init-template.yaml with the instance's
# authentication block removed, under the logical id `Node`: it draws the init site of
# filter_through_authentication_and_init_sites.guard and not the authentication site. Under
# filter_through_a_metadata_projection.guard, whose only site is the authentication one, no map here
# holds the key the predicate names, so the file draws no notice.
Resources:
  RootRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "the role is scoped by its trust policy"
  Node:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: "t2.micro"
      SubnetId:
        "Ref": "subnetId"
    Metadata:
      AWS::CloudFormation::Init:
        config:
          commands:
            01_hello:
              command: "echo hello"
