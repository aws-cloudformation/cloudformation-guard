# Two resources, each with a Properties map; only the instance's carries ImageId. A binding of
# `Resources.*[ Type exists ].Properties` holds both maps, and a filter for `ImageId exists` has one
# map it holds on and one it does not. No resource lacks Properties, so nothing resolves unresolved.
Resources:
  RootRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
  EC2I4LBA1:
    Type: "AWS::EC2::Instance"
    Properties:
      ImageId: "ami-6df1e514"
      InstanceType: "t2.micro"
      SubnetId:
        "Ref": "subnetId"
