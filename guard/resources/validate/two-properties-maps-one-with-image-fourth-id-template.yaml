# The same two resources as two-properties-maps-one-with-image-template.yaml, with the instance under a
# fourth logical id, `Host`. Paired with the third-id template: over five templates that all draw the
# one filter site in filter_through_a_key_tailed_projection.guard, the trailer names three of the four
# later files and counts the last.
Resources:
  RootRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
  Host:
    Type: "AWS::EC2::Instance"
    Properties:
      ImageId: "ami-6df1e514"
      InstanceType: "t2.micro"
      SubnetId:
        "Ref": "subnetId"
