# The same shape with no credential in the authentication block. The published rule used to report
# PASS here; it now reports SKIP with the same notice.
Resources:
  RootRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
  EC2I4LBA1:
    Type: "AWS::EC2::Instance"
    Properties:
      ImageId: "ami-6df1e514"
      InstanceType: "t2.micro"
      SubnetId:
        "Ref": "subnetId"
  Metadata:
    Type: AWS::CloudFormation::Authentication
    AWS::CloudFormation::Authentication:
      testS3:
        type: "s3"
        roleName: !Ref RootRole
        buckets:
          - "somebucket333"
