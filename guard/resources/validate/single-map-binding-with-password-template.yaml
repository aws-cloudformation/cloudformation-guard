# A resource whose logical id is `Metadata` carrying a CloudFormation authentication block with a
# password. The published rule this exercises reports FAIL here: the filter through
# `%cfn_authentication_rule` tests the one map itself, as `[*]` reads a map with a scalar entry.
Resources:
  RootRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
  EC2I4LBA1:
    Type: "AWS::EC2::Instance"
    Properties:
      ImageId: "ami-6df1e514"
      InstanceType: "t2.micro"
      SubnetId:
        "Ref": "subnetId"
  Metadata:
    Type: AWS::CloudFormation::Authentication
    AWS::CloudFormation::Authentication:
      testBasic:
        type: "basic"
        username: "testUsername1"
        password: "sensitive_password"
        uris:
          - "http://www.example.com/test"
