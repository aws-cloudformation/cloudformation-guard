# Nine SNS topics whose names form the allow-list, plus one volume that is not on it.
#
# Fixture for a_long_in_comparison_is_truncated_with_a_total. The point is nine *separate*
# right-hand values: a literal list like ['a','b'] is one value however long it is, so it never
# reaches the reporter's truncation path.
Resources:
  Allowed0:
    Type: AWS::SNS::Topic
    Properties:
      Name: n0
  Allowed1:
    Type: AWS::SNS::Topic
    Properties:
      Name: n1
  Allowed2:
    Type: AWS::SNS::Topic
    Properties:
      Name: n2
  Allowed3:
    Type: AWS::SNS::Topic
    Properties:
      Name: n3
  Allowed4:
    Type: AWS::SNS::Topic
    Properties:
      Name: n4
  Allowed5:
    Type: AWS::SNS::Topic
    Properties:
      Name: n5
  Allowed6:
    Type: AWS::SNS::Topic
    Properties:
      Name: n6
  Allowed7:
    Type: AWS::SNS::Topic
    Properties:
      Name: n7
  Allowed8:
    Type: AWS::SNS::Topic
    Properties:
      Name: n8
  NonCompliantVolume:
    Type: AWS::EC2::Volume
    Properties:
      VolumeType: gp9
      Size: 50
      AvailabilityZone: us-west-2b
