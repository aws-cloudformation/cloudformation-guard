# The resource of one-resource-with-a-wrapper-entry-template.yaml without its `Type` string: a map of
# three sub-maps and no scalar entry, a collection to the slot after a variable bound to it. One entry,
# `Wrapper`, carries a `Metadata` map with an `AWS::CloudFormation::Authentication` block; the map's own
# `Metadata` has no such key.
Resources:
  Only:
    Metadata:
      Note: no authentication block at this level
    Wrapper:
      Metadata:
        AWS::CloudFormation::Authentication:
          WrappedCreds:
            type: basic
            username: deploy
            password: sensitive_password
    Properties:
      ImageId: ami-6df1e514
      InstanceType: t2.micro
