# The resource of one-resource-with-a-wrapper-entry-template.yaml without its `Type` string and without a
# `Metadata` of its own: a map of two sub-maps and no scalar entry, a collection to the slot after a
# variable bound to it. One entry, `Wrapper`, carries a `Metadata` map with an
# `AWS::CloudFormation::Authentication` block; the map itself has no `Metadata` key. (Had it one beside
# `Wrapper`, the map would hold the predicate's key as `Wrapper` does and be one object to the slot.)
Resources:
  Only:
    Wrapper:
      Metadata:
        AWS::CloudFormation::Authentication:
          WrappedCreds:
            type: basic
            username: deploy
            password: sensitive_password
    Properties:
      ImageId: ami-6df1e514
      InstanceType: t2.micro
