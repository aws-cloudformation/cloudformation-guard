# One instance carrying a CloudFormation authentication block under its `Metadata`, an `S3` block
# that holds no password. There is no `WebServer` resource: a rule that names one by logical id does
# not apply here, while a rule that selects every resource carrying the block checks this one.
Resources:
  Worker:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Authentication:
        S3AccessCreds:
          type: S3
          roleName: WorkerRole
          buckets:
            - worker-artifacts
    Properties:
      ImageId: ami-6df1e514
      InstanceType: t2.micro
