# A Kubernetes container's `resources`: a map of two sub-maps sharing `cpu` and `memory`, whose own key
# `limits` names a member while `requests` holds no `limits` of its own. `resources[*].limits exists`
# would be answered by the map's own `limits`, not by each member, and is REFUSED, the refusal printed
# whole with its remedy (`resources.limits exists`, the direct path).
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: "0.5"
    memory: 512Mi
