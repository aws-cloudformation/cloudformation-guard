# One resource one of whose entries, `Wrapper`, is itself a map carrying a `Metadata` map with an
# `AWS::CloudFormation::Authentication` block, beside the resource's `Type` string: a mixed map. A
# positive predicate on that path through a variable holding the resource is tested on the resource
# itself, as cfn-guard 3.2.1 tested it: its own `Metadata` has no such block, so nothing is selected.
# The literal `Resources.Only[ ... ]` walks the entries and selects `Wrapper`.
Resources:
  Only:
    Type: AWS::EC2::Instance
    Metadata:
      Note: no authentication block at this level
    Wrapper:
      Metadata:
        AWS::CloudFormation::Authentication:
          WrappedCreds:
            type: basic
            username: deploy
            password: sensitive_password
    Properties:
      ImageId: ami-6df1e514
      InstanceType: t2.micro
