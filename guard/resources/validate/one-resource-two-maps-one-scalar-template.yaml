# One resource whose entries are exactly two maps and one scalar: `Type` (a string), `Metadata` (a map) and
# `Properties` (a map). Neither map has a `Tags` key. Built for the filters through a variable bound to a
# single resource, so that what they select is pinned to a shape no other test depends on: the scalar
# `Type` entry makes the resource one object, which such a filter tests as a whole.
Resources:
  Only:
    Type: AWS::S3::Bucket
    Metadata:
      Note: kept for the filter to walk
    Properties:
      BucketName: only-bucket
