# The same two resources as two-properties-maps-one-with-image-template.yaml, with the instance under a
# different logical id. The one filter site in filter_through_a_key_tailed_projection.guard loses its
# selection at /Resources/Instance/Properties here and at /Resources/EC2I4LBA1/Properties there, so a
# notice that names the map differs in text between the two templates while its site is the same.
Resources:
  RootRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
  Instance:
    Type: "AWS::EC2::Instance"
    Properties:
      ImageId: "ami-6df1e514"
      InstanceType: "t2.micro"
      SubnetId:
        "Ref": "subnetId"
