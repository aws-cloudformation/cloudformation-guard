# One resource that gives the console section three "Could not be evaluated" lines of two kinds.
#
# `Size` is a 2048-character string with no whitespace in it. `parse_int` over it raises the
# converter's message, which carries the whole string, so the line the console prints for that rule
# embeds a template value and is held to the recorded-message cap.
#
# `Tags` is a map, `{ Environment: production }`. A filter over it that compares a key the map does
# not hold (`Name`) reads the map as one object, keeps nothing, and the read of `Value` after it is
# refused. The refusal's sentence names the query, the key, the remedy and the path, runs well past
# the cap, and carries no value, so the console prints it whole.
#
# `Blob` is a 2150-character string that is not JSON: `{"a": ` followed by 2144 characters with no
# whitespace in them. `json_parse` over it raises the parser's message, which carries the string, and the
# line the console prints for that rule is held to the recorded-message cap like the converter's.
Resources:
  Big:
    Type: AWS::S3::Bucket
    Properties:
      Blob: "{\"a\": "
      Size: 
      Configuration:
        Settings:
          Tags:
            Environment: production
