# The two resources of two-properties-maps-one-with-image-template.yaml with the instance's
# `InstanceType` removed: it draws the `ImageId exists` site of
# filter_through_image_and_instance_type_sites.guard and not the `InstanceType exists` site.
Resources:
  RootRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
  Box:
    Type: "AWS::EC2::Instance"
    Properties:
      ImageId: "ami-6df1e514"
      SubnetId:
        "Ref": "subnetId"
