# Two resources, each with a Metadata map and no scalar entry in it; only the instance's carries the
# authentication and init blocks. A binding of `Resources.*[ Metadata exists ].Metadata` holds both maps,
# and a filter for `"AWS::CloudFormation::Authentication" exists` has one map it holds on and one it does
# not. Every resource has a Metadata map, so nothing resolves unresolved.
Resources:
  RootRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "ec2.amazonaws.com"
            Action:
              - "sts:AssumeRole"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "the role is scoped by its trust policy"
  EC2I4LBA1:
    Type: "AWS::EC2::Instance"
    Properties:
      ImageId: "ami-6df1e514"
      InstanceType: "t2.micro"
      SubnetId:
        "Ref": "subnetId"
    Metadata:
      AWS::CloudFormation::Authentication:
        testBasic:
          type: "basic"
          username: "testUsername1"
          password: "sensitive_password"
      AWS::CloudFormation::Init:
        config:
          commands:
            01_hello:
              command: "echo hello"
