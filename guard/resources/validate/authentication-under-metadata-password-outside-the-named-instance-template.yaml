# The instance the documented rewrites name, `WebServer`, carries an `S3` authentication block with no
# password, while a launch configuration beside it carries a `basic` block that holds one. A rule that
# tests only the named instance passes here; a rule over every resource carrying the block fails on the
# launch configuration. The two documented rewrites are told apart by their verdicts on this template.
Resources:
  WebServer:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Authentication:
        S3AccessCreds:
          type: S3
          roleName: WebServerRole
          buckets:
            - webserver-artifacts
    Properties:
      ImageId: ami-6df1e514
      InstanceType: t2.micro
  LaunchConfig:
    Type: AWS::AutoScaling::LaunchConfiguration
    Metadata:
      AWS::CloudFormation::Authentication:
        FleetCreds:
          type: basic
          username: deploy
          password: sensitive_password
          uris:
            - http://www.example.com/fleet
    Properties:
      ImageId: ami-6df1e514
      InstanceType: t2.micro
