Mappings:
  Allowed:
    Types: [gp2, gp3]
    Upper: [GP2, GP3]
    Entries:
      - Name: gp2
        Kind: volume
      - Name: gp3
        Kind: volume
    Nested:
      - Sub:
          Name: gp2
      - Sub:
          Name: gp3
Resources:
  V:
    Type: AWS::EC2::Volume
    Properties:
      VolumeType: g
