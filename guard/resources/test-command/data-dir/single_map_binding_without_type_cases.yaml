###
# The two shapes of single_map_binding_cases.yaml (an authentication block with a password and one
# without) for a resource whose logical id is `Metadata`, with the scalar `Type` entry left out. The
# rules file is `resources/validate/filter_through_a_single_map_binding.guard`.
#
# Here the `Metadata` map has no scalar entry and the predicate names `AWS::CloudFormation::Authentication`,
# a key the map holds itself and none of its map-valued entries holds, so the filter through
# `%cfn_authentication_rule` keeps the walk: it tests the map's entries, selects nothing, and the `when`
# gate does not apply. Both cases expect SKIP. The rules file is evaluated once per case and the same
# filter loses the same selection each time, so the notice is produced for each case and collapsed to
# one before it is written; the test asserts one.
###
---
- name: Authentication block with a password, no Type entry
  input:
    Resources:
      RootRole:
        Type: "AWS::IAM::Role"
        Properties:
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Principal:
                  Service:
                    - "ec2.amazonaws.com"
                Action:
                  - "sts:AssumeRole"
      Metadata:
        AWS::CloudFormation::Authentication:
          testBasic:
            type: "basic"
            username: "testUsername1"
            password: "sensitive_password"
            uris:
              - "http://www.example.com/test"
  expectations:
    rules:
      CFN_AUTHENTICATION_RULE: SKIP

- name: Authentication block without a password, no Type entry
  input:
    Resources:
      RootRole:
        Type: "AWS::IAM::Role"
        Properties:
          AssumeRolePolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Principal:
                  Service:
                    - "ec2.amazonaws.com"
                Action:
                  - "sts:AssumeRole"
      Metadata:
        AWS::CloudFormation::Authentication:
          testS3:
            type: "s3"
            roleName: !Ref RootRole
            buckets:
              - "somebucket333"
  expectations:
    rules:
      CFN_AUTHENTICATION_RULE: SKIP
