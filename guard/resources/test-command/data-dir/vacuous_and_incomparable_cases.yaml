###
# Three cases over one clause, all passing. The rules file is
# `resources/validate/vacuous_and_incomparable_clauses.guard`, shared with the validate-side notice
# test so one fixture describes the hazard.
#
# One clause here rather than the two the parent branch has: this branch is the release that makes an
# empty-collection comparison report a failure, so that notice and the clause demonstrating it were
# both deleted. The expectations went with them -- an expectation naming a rule that no longer exists
# is not checked, and since `Say when a test expectation matched no rule` it also prints a line
# saying so on every run.
#
# Three cases rather than one on purpose: a rule file is evaluated once per case, so a reporter that
# wrote each notice as it was produced would print the same notice three times. The test asserts one.
###
---
- name: A string against a list of integers, first case
  input:
    Sizes: []
    Name: "50"
  expectations:
    rules:
      incomparable_membership: PASS

- name: A string against a list of integers, second case
  input:
    Sizes: []
    Name: "50"
  expectations:
    rules:
      incomparable_membership: PASS

- name: A different string, third case
  input:
    Sizes: []
    Name: "not-a-number"
  expectations:
    rules:
      incomparable_membership: PASS
