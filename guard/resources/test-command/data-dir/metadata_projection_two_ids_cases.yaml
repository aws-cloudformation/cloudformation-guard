###
# Two cases over `resources/validate/filter_through_a_metadata_projection.guard`, each with one
# instance carrying an authentication block under its `Metadata`, under a DIFFERENT logical id. The
# filter loses its selection in both, so the notice it raises names a different map each time
# (`/Resources/EC2A/Metadata`, `/Resources/EC2B/Metadata`). One filter site, so one line: the test
# command keeps the once-per-site reading across cases by site, not by text.
#
# Each instance's `Metadata` holds only a map-valued entry, so it has no scalar entry: the filter through
# the variable keeps the walk, tests the entries, which lack the key, selects nothing, and the rule is
# SKIP with its notice. A `Metadata` map with a scalar entry is one object and is tested as a whole
# instead, which draws no notice.
###
---
- name: Instance named EC2A
  input:
    Resources:
      Role:
        Type: "AWS::IAM::Role"
        Properties:
          Path: "/"
        Metadata:
          cfn_nag:
            rules_to_suppress:
              - id: W11
                reason: "the role is scoped by its trust policy"
      EC2A:
        Type: "AWS::EC2::Instance"
        Properties:
          ImageId: "ami-6df1e514"
          InstanceType: "t2.micro"
        Metadata:
          AWS::CloudFormation::Authentication:
            testBasic:
              type: "basic"
              username: "testUsername1"
              password: "sensitive_password"
  expectations:
    rules:
      FILTER_THROUGH_A_METADATA_PROJECTION: SKIP

- name: Instance named EC2B
  input:
    Resources:
      Role:
        Type: "AWS::IAM::Role"
        Properties:
          Path: "/"
        Metadata:
          cfn_nag:
            rules_to_suppress:
              - id: W11
                reason: "the role is scoped by its trust policy"
      EC2B:
        Type: "AWS::EC2::Instance"
        Properties:
          ImageId: "ami-6df1e514"
          InstanceType: "t2.micro"
        Metadata:
          AWS::CloudFormation::Authentication:
            testBasic:
              type: "basic"
              username: "testUsername1"
              password: "sensitive_password"
  expectations:
    rules:
      FILTER_THROUGH_A_METADATA_PROJECTION: SKIP
