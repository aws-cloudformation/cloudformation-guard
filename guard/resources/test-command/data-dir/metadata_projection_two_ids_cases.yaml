###
# Two cases over `resources/validate/filter_through_a_metadata_projection.guard`, each with one
# instance carrying an authentication block under its `Metadata`, under a DIFFERENT logical id. The
# filter, `testBasic !exists`, loses its selection in both, so the notice it raises names a different
# map each time (`/Resources/EC2A/Metadata`, `/Resources/EC2B/Metadata`). One filter site, so one line:
# the test command keeps the once-per-site reading across cases by site, not by text.
#
# Each instance's `Metadata` holds only a map-valued entry, so it has no scalar entry, and `testBasic` is
# not a key the map holds itself: the filter through the variable keeps the walk. The authentication
# block carries `testBasic` and is no member, so nothing is kept from the map and the notice goes out. No
# other resource carries a `Metadata` map, so the selection is empty and the key read below it is not
# applicable: both cases expect SKIP. An engine that read the instance's map as one object would select
# it (the map lacks `testBasic`) and FAIL on the key it holds; one that kept the authentication block
# would PASS on the key the block lacks; neither meets SKIP.
###
---
- name: Instance named EC2A
  input:
    Resources:
      Role:
        Type: "AWS::IAM::Role"
        Properties:
          Path: "/"
      EC2A:
        Type: "AWS::EC2::Instance"
        Properties:
          ImageId: "ami-6df1e514"
          InstanceType: "t2.micro"
        Metadata:
          AWS::CloudFormation::Authentication:
            testBasic:
              type: "basic"
              username: "testUsername1"
              password: "sensitive_password"
  expectations:
    rules:
      FILTER_THROUGH_A_METADATA_PROJECTION: SKIP

- name: Instance named EC2B
  input:
    Resources:
      Role:
        Type: "AWS::IAM::Role"
        Properties:
          Path: "/"
      EC2B:
        Type: "AWS::EC2::Instance"
        Properties:
          ImageId: "ami-6df1e514"
          InstanceType: "t2.micro"
        Metadata:
          AWS::CloudFormation::Authentication:
            testBasic:
              type: "basic"
              username: "testUsername1"
              password: "sensitive_password"
  expectations:
    rules:
      FILTER_THROUGH_A_METADATA_PROJECTION: SKIP
