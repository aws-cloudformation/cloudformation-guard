# The second case's `name` is an alias to a name no node before it anchors. A name the command cannot
# read is that case's error, reported without a name: the message names the field and carries the
# alias's refusal, and the case before it keeps its verdict.
- name: an ordinary case
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS

- name: *nope
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS
