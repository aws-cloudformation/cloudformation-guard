# The second case expects `a_is_one` to be a sequence tagged `!!If`, which is `!If` with one `!` too
# many. The loader marks the container unreadable, and a status the command cannot read is that
# case's error, since the expectation cannot be checked; the message names the rule and carries the
# tag's refusal, and the case before it keeps its verdict.
- name: an ordinary case
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS

- name: a case whose expected status is under a two-bang tag
  input:
    A: 1
  expectations:
    rules:
      a_is_one: !!If [PASS]
