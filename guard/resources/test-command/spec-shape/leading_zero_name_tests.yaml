# The second case's `name:` is a `!!int` over a decimal with a redundant leading zero, which YAML 1.1
# reads as octal and YAML 1.2 as decimal. The loader refuses the tagged scalar with that reason, and
# the case fails with the field's name, the scalar as written and the reason; the case before it keeps
# its verdict.
- name: an ordinary case
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS

- name: !!int 0755
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS
