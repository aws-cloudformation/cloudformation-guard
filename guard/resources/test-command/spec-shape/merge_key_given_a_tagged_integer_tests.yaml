# The second case's `input:` gives a merge key a `!!int` whose payload is not an integer. The loader
# cannot read the tagged scalar, and a merge key given anything but a mapping is refused as such: the
# case fails with the merge key's refusal, naming the key and its position, and the case before it
# keeps its verdict.
- name: an ordinary case
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS

- name: a merge key given a tagged integer that is not one
  input:
    A: 1
    <<: !!int abc
  expectations:
    rules:
      a_is_one: PASS
