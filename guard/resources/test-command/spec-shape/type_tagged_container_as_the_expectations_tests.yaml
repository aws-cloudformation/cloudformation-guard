# The second case's `expectations` is a mapping tagged `!!Equals`, which is `!Equals` with one `!`
# too many. The loader marks the container unreadable, and with nothing to check the case against,
# that case fails; the message names the field and carries the tag's refusal, and the case before it
# keeps its verdict.
- name: an ordinary case
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS

- name: a case whose expectations are under a two-bang tag
  input:
    A: 1
  expectations: !!Equals {rules: {a_is_one: PASS}}
