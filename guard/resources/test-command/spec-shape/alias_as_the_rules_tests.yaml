# The second case's `rules` under `expectations` is an alias to a name no node before it anchors.
# With nothing to check the case against, that case fails; the message names the field and carries
# the alias's refusal, and the case before it keeps its verdict.
- name: an ordinary case
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS

- name: a case whose rules are an unreadable alias
  input:
    A: 1
  expectations:
    rules: *nope
