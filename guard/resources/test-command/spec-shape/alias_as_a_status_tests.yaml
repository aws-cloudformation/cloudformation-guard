# The second case expects `a_is_one` to be an alias to a name no node before it anchors. A status
# the command cannot read is that case's error, since the expectation cannot be checked; the message
# names the rule and carries the alias's refusal, and the case before it keeps its verdict.
- name: an ordinary case
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS

- name: a case whose expected status is an unreadable alias
  input:
    A: 1
  expectations:
    rules:
      a_is_one: *nope
