# The second case's expected status is a `!!int` over a decimal with a redundant leading zero, which
# YAML 1.1 reads as octal and YAML 1.2 as decimal. The loader refuses the tagged scalar with that
# reason, and the case fails with the rule's name, the scalar as written and the reason, but with no
# integer offered, since a status is PASS, FAIL or SKIP; the case before it keeps its verdict.
- name: an ordinary case
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS

- name: a status written as a tagged leading-zero integer
  input:
    A: 1
  expectations:
    rules:
      a_is_one: !!int 0755
