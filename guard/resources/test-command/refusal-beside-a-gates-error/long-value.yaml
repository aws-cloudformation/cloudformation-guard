###
# The input of the `test` cell for the bound on a reason. The compared entry of `L` holds a 910-character
# word after a few words, so the converter's error quotes it; `M` holds an intrinsic beside the compared
# entry (a refused selection), so each gated rule of the rules file fails closed on the converter's error
# with the refusal settled beside it. Both expectations are PASS, so both are unmet. The plain reporter's
# reason is cut at the console's bound (the one-word value is dropped whole); the structured reporters carry
# the sentence whole.
###
---
- name: a long value in the sentence a converter's error quotes
  input:
    Resources:
      M:
        Tags:
          Env: dev
          ENV:
            Ref: Stage
      L:
        Tags:
          - Key: Env
            Value: "not a number "
  expectations:
    rules:
      opened_by_some: PASS
      opened_by_all: PASS
