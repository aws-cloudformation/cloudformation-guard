# An alias is resolved by copying the anchored node, so a chain of anchors that each alias the one
# before it grows by a factor per level. The copies are counted against a budget for the test case,
# and the second case crosses it at its last level: that case fails with a message naming the budget,
# the case as what it is spent over, and the alias that crossed it, and the first case keeps its
# verdict.
- name: a case before the chain
  input:
    A: 1
  expectations:
    rules:
      a_is_one: PASS

- name: an alias chain past the expansion budget
  input:
    a: &a [x, x, x, x, x, x, x, x, x, x]
    b: &b [*a, *a, *a, *a, *a, *a, *a, *a, *a, *a]
    c: &c [*b, *b, *b, *b, *b, *b, *b, *b, *b, *b]
    d: &d [*c, *c, *c, *c, *c, *c, *c, *c, *c, *c]
    e: &e [*d, *d, *d, *d, *d, *d, *d, *d, *d, *d]
    f: &f [*e, *e, *e, *e, *e, *e, *e, *e, *e, *e]
  expectations:
    rules:
      a_is_one: SKIP
