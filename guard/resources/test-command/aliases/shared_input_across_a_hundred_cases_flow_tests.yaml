# shared_input_across_a_hundred_cases_tests.yaml in flow style with short case names: the same
# hundred cases, the same shared input of 9,908 nodes and 990,689 copies through aliases, in about
# two thirds of the bytes. The ceiling over the whole document is set by the file's events other than
# aliases, not by its bytes, so this file is held to the same ceiling as its block-style twin and
# every case loads. A ceiling of 100 nodes for each byte would stand at the 1,000,000 floor for a
# file this size and refuse the hundredth case of this file, while accepting the other, which is the
# same document.
