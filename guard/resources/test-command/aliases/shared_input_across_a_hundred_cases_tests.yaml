# One input anchored in the first case and aliased by the ninety-nine cases after it. The copies an
# alias makes are counted against the expansion budget, and the budget is per test case, so each case
# here costs one copy of the shared input however many cases alias it, and every case runs.
#
# The shared input is 9,908 nodes: the mapping, `A`, the 101-node `Pad`, `More` holding 97 copies
# of `Pad` (9,798), and the 7-node `Last`. The first case charges 9,797 (the 97 copies of `Pad`;
# recording the two anchors is not charged) and each alias 9,908 more: 980,781 after the
# ninety-ninth case and 990,689 at the hundredth. Counted over the whole file that is inside the
# budget, and one more case would cross it, so which case failed would depend on how many came
# before it; counted per case, every case costs one copy and the count of cases is no limit.
- name: the case that declares the shared input
  input: &shared
    A: 1
    Pad: &row [x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x,
               x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x,
               x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x,
               x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x,
               x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x, x]
    More: [*row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row,
           *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row,
           *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row,
           *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row,
           *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row,
           *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row, *row,
           *row]
    Last: [z, z, z, z, z, z]
  expectations:
    rules:
      a_is_one: PASS

