name: Pull Request

on:
  push:
    branches: [main, development]
    paths-ignore:
      - 'guard/ts-lib/**'
  pull_request:
    branches: [main, development]
    paths-ignore:
      - 'guard/ts-lib/**'

env:
  CARGO_TERM_COLOR: always
  FUZZ_TIME: 420
permissions:
  contents: read
jobs:
  build:
    name: Build all crates & run unit tests

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v2
      - name: Build all crates on ${{ matrix.os }}
        run: cargo build --release --verbose
      - name: Run unit tests ${{ matrix.os }}
        run: cargo test --verbose

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Shellcheck
        run: shellcheck install-guard.sh install-tests/test-install-guard-backoff.sh

  # The PowerShell counterpart to shellcheck. install-guard.ps1 had no static analysis, which is
  # how a WMI cmdlet that PowerShell 6 removed sat in it unnoticed -- this workflow runs pwsh 7,
  # so nothing here would have caught it before a user did. Configured by
  # .github/PSScriptAnalyzerSettings.psd1; runs on ubuntu because the analyser is
  # platform independent and a Linux runner is cheaper than a Windows one.
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AcceptLicense
      # One call per file: Invoke-ScriptAnalyzer's -Path is a single string, so passing a list
      # analyses only the first and reports nothing about the rest -- a silently narrowed gate.
      - name: Analyze the PowerShell scripts
        shell: pwsh
        run: |
          $targets = @('install-guard.ps1', 'install-tests/Test-InstallGuardBackoff.ps1')
          $findings = @()
          foreach ($target in $targets) {
            $findings += Invoke-ScriptAnalyzer -Path $target `
              -Settings .github/PSScriptAnalyzerSettings.psd1
          }
          if ($findings) {
            $findings | Format-Table -AutoSize Severity, ScriptName, Line, RuleName, Message | Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)"
          }
          Write-Host "PSScriptAnalyzer: no findings in $($targets -join ', ')"

  formatting:
    name: Formatting check (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

  # These jobs install a binary built from the branch under test, not the last published release.
  #
  # They used to resolve "latest release" from the GitHub API and install that, which tested the
  # installer against a binary having nothing to do with the change under review, and made the job
  # depend on an API whose anonymous limit is 60 requests per hour per source IP -- shared across
  # every job on a runner. That limit is what failed the Windows job on an unrelated pull request.
  #
  # Packaging the local build into the release layout and pointing the installer at it with
  # GUARD_DOWNLOAD_BASE_URL removes the network from the critical path and makes the assertion
  # meaningful: the checksum of the installed binary is compared against the one just built.
  #
  # GITHUB_TOKEN is still exported. Nothing in the pinned path needs it, but any future step that
  # resolves a version should be authenticated by default rather than discover the limit in CI.
  installScript:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Testing Install Script (install-guard.sh)
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        name: Checkout cfn-guard
        with:
          path: cloudformation-guard
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build cfn-guard from this branch
        working-directory: cloudformation-guard
        run: cargo build --release --bin cfn-guard
      - name: Package the build into the release layout and install it
        working-directory: cloudformation-guard
        run: |
          set -eu
          VERSION=$(./target/release/cfn-guard --version | awk '{ print $2 }')
          MAJOR=${VERSION%%.*}
          case "$(uname -s)" in
            Darwin) OS_TYPE=macos ;;
            *) OS_TYPE=ubuntu ;;
          esac
          ARCH_TYPE=$(uname -m)
          [ "$ARCH_TYPE" = "arm64" ] && ARCH_TYPE=aarch64
          NAME="cfn-guard-v${MAJOR}-${ARCH_TYPE}-${OS_TYPE}-latest"

          mkdir -p "stage/${NAME}" "artifacts/${VERSION}"
          cp target/release/cfn-guard "stage/${NAME}/cfn-guard"
          tar -czf "artifacts/${VERSION}/${NAME}.tar.gz" -C stage "${NAME}"

          GUARD_DOWNLOAD_BASE_URL="file://${PWD}/artifacts" sh install-guard.sh -v "${VERSION}"

          # The installer reports success on its own terms; this checks it installed the binary we
          # just built rather than something already on the runner.
          "${HOME}/.guard/bin/cfn-guard" --version
          BUILT=$(shasum -a 256 target/release/cfn-guard | awk '{ print $1 }')
          INSTALLED=$(shasum -a 256 "${HOME}/.guard/${MAJOR}/${NAME}/cfn-guard" | awk '{ print $1 }')
          if [ "$BUILT" != "$INSTALLED" ]; then
            echo "installed binary does not match the one built from this branch" >&2
            echo "  built:     $BUILT" >&2
            echo "  installed: $INSTALLED" >&2
            exit 1
          fi
          echo "installed binary matches this branch's build ($BUILT)"

  installScriptWindows:
    runs-on: windows-latest
    name: Testing Windows Install Script (install-guard.ps1)
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3
        name: Checkout cfn-guard
        with:
          path: cloudformation-guard
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build cfn-guard from this branch
        working-directory: cloudformation-guard
        run: cargo build --release --bin cfn-guard
      - name: Package the build into the release layout and install it
        working-directory: cloudformation-guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& ./target/release/cfn-guard.exe --version).Split(' ')[1]
          $major = $version.Split('.')[0]
          $arch = switch ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture) {
            'Arm64' { 'aarch64' } 'X64' { 'x86_64' } 'X86' { 'i686' }
          }
          $name = "cfn-guard-v$major-$arch-windows-latest"

          New-Item -ItemType Directory -Force -Path "stage/$name", "artifacts/$version" | Out-Null
          Copy-Item target/release/cfn-guard.exe "stage/$name/cfn-guard.exe"
          tar -czf "artifacts/$version/$name.tar.gz" -C stage $name

          $env:GUARD_DOWNLOAD_BASE_URL = "file://$($PWD.Path -replace '\\','/')/artifacts"
          ./install-guard.ps1 -Version $version

          # The installer reports success on its own terms; this checks it installed the binary we
          # just built rather than something already on the runner.
          $built = (Get-FileHash target/release/cfn-guard.exe -Algorithm SHA256).Hash
          $installed = (Get-FileHash "$env:USERPROFILE\.guard\$major\$name\cfn-guard.exe" -Algorithm SHA256).Hash
          if ($built -ne $installed) {
            throw "installed binary ($installed) does not match this branch's build ($built)"
          }
          Write-Host "installed binary matches this branch's build ($built)"

  # The two jobs above pin the installer to an explicit version and a local archive, which is what
  # makes them independent of the network -- and also what makes them blind to the rate-limit
  # handling: get_version returns before github_api is entered, so nothing in either job reaches
  # Retry-After parsing, X-RateLimit-Reset parsing, or the retry ceiling. A regression in any of
  # those three left CI green.
  #
  # These jobs drive the same entry point with no version pinned, against a stub API on localhost
  # that returns a scripted 403/429 sequence. That makes the responses an input: the real API cannot
  # be asked for a 429, and waiting for a genuine limit would be neither fast nor deterministic.
  #
  # No Rust build. The lookup is what is under test, and the archive the recovery path installs is a
  # stub, so requiring a compile would add several minutes and pin nothing further.
  installScriptBackoff:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Install script rate-limit handling (install-guard.sh)
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assert the backoff paths honour the API's own signals
        run: sh install-tests/test-install-guard-backoff.sh

  # The same suite with dash as the shell under test, because `sh` is not one shell and the difference
  # is load-bearing here.
  #
  # install-guard.sh declares `#!/bin/sh`, and dash is `/bin/sh` on Debian and Ubuntu -- so dash is what
  # a large share of callers actually run it under. Arithmetic on a non-numeric value is the case that
  # separates them: bash evaluates the words as unset names and carries on, while dash refuses with
  # "Illegal number" and the command substitution around it returns empty, which leaves the retry loop
  # with no delay at all and hammers an exhausted quota five times in under a second. Measured both
  # ways; the guards in backoff_seconds are what stop it, and only a dash run can show that.
  #
  # ubuntu-latest already provides dash as /bin/sh, so this needs no install step -- GUARD_TEST_SH names
  # it explicitly rather than relying on what /bin/sh happens to be on the runner.
  installScriptBackoffDash:
    runs-on: ubuntu-latest
    name: Install script rate-limit handling (install-guard.sh under dash)
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assert the backoff paths hold under a strict POSIX shell
        env:
          GUARD_TEST_SH: dash
        run: sh install-tests/test-install-guard-backoff.sh

  # A third shell, because dash and bash between them do not cover how `[` behaves.
  #
  # The header guards in backoff_seconds have to reject a non-numeric value before `$(( ))` sees it.
  # Spelled as the numeric test `[ "$_reset" -ge 0 ] 2>/dev/null`, that worked on both shells above --
  # bash and dash each make `[` fail on a non-numeric operand -- and did not work on ksh, which
  # evaluates test operands arithmetically: `not-a-number` parses as the three unset names
  # `not - a - number`, sums to 0, `0 -ge 0` is true, and the value went straight through the guard
  # into the arithmetic that aborts on it. Five attempts in 22ms against an exhausted quota, which is
  # the defect the guard exists to prevent, reached through the guard rather than past it.
  #
  # So this job is not about ksh being a popular `/bin/sh`. It is the only runner here that can tell a
  # portable guard from one that happens to suit the two shells it was written against, and the numeric
  # spelling passed every other job in this workflow while being wrong.
  installScriptBackoffKsh:
    runs-on: ubuntu-latest
    name: Install script rate-limit handling (install-guard.sh under ksh)
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Not preinstalled on ubuntu-latest, unlike dash.
      - name: Install ksh
        run: sudo apt-get update && sudo apt-get install -y ksh
      - name: Assert the backoff paths hold where `[` evaluates its operands arithmetically
        env:
          GUARD_TEST_SH: ksh
        run: sh install-tests/test-install-guard-backoff.sh

  installScriptBackoffWindows:
    runs-on: windows-latest
    name: Install script rate-limit handling (install-guard.ps1)
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assert the backoff paths honour the API's own signals
        shell: pwsh
        run: ./install-tests/Test-InstallGuardBackoff.ps1

  linting:
    name: Linting check (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  typocheck:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
        with:
          files: .
          config: ./_typos.toml

  fuzz:
    strategy:
      matrix:
        target: ["guard_dsl", "yaml"]
    runs-on: ubuntu-latest
    name: Run Fuzz Checks
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          matcher: false
          rustflags: ""
      - uses: actions-rs/cargo@v1
        name: Install cargo-fuzz
        with:
          command: install
          args: cargo-fuzz
      - name: fuzz ${{ matrix.target }}
        run: |
          cd guard/fuzz
          cargo +nightly fuzz run fuzz_${{ matrix.target }} -- -max_total_time=${{ env.FUZZ_TIME }}

  aws-guard-rules-registry-integration-tests-linux-and-macos:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Integration tests against aws-guard-rules-registry
    steps:
      - uses: actions/checkout@v3
        name: Checkout cfn-guard
        with:
          path: cloudformation-guard
      - name: Build binary
        run: |
          cd cloudformation-guard/guard/
          cargo build --release
      - uses: actions/checkout@v3
        name: Checkout aws-guard-rules-registry
        with:
          repository: aws-cloudformation/aws-guard-rules-registry
          path: aws-guard-rules-registry
          ref: main
      - name: Run integration tests using test command
        run: |
          if cloudformation-guard/target/release/cfn-guard test -d aws-guard-rules-registry/rules; then
              echo "The integration tests for test command have passed."
          else
              echo "The integration tests for test command have failed."
              exit 1
          fi

      - name: Run integration tests using parse-tree command
        run: |
          cd aws-guard-rules-registry/rules

          FAILED_RULES=()
          SKIPPED_RULES=()
          rules=( $(find . -type f -name "*.guard") )

          for rule in "${rules[@]}"
          do
              if [ $(sed -e '/^[ \s]*#.*$/d' $rule |  sed -r '/^\s*$/d' | wc -l) -eq 0 ]; then
                  SKIPPED_RULES+=("$rule")
              elif ../../cloudformation-guard/target/release/cfn-guard parse-tree --rules $rule; then
                  continue
              else
                  FAILED_RULES+=("$rule")
              fi
          done

          SKIPPED_RULE_COUNT=${#SKIPPED_RULES[@]}
          if [ $SKIPPED_RULE_COUNT -gt 0 ]; then
              echo "The following $SKIPPED_RULE_COUNT rule(s) were skipped because they contained only comments:"
              for skipped_rule in "${SKIPPED_RULES[@]}"
              do
                  echo "$skipped_rule"
              done
          fi

          FAILED_RULE_COUNT=${#FAILED_RULES[@]}

          if [ $FAILED_RULE_COUNT -gt 0 ]; then
              echo "The following $FAILED_RULE_COUNT rule(s) have failed the parse-tree integration tests with a non-zero error code:"
              for failed_rule in "${FAILED_RULES[@]}"
              do
                  echo "$failed_rule"
              done
              exit 1
          else
              echo "All the rules have succeeded the parse-tree integration tests."
          fi

  aws-guard-rules-registry-integration-tests-windows:
    runs-on: windows-latest
    name: Integration tests against aws-guard-rules-registry for Windows
    steps:
      - uses: actions/checkout@v3
        name: Checkout cfn-guard
        with:
          path: cloudformation-guard
      - name: Build binary
        run: |
          cd cloudformation-guard/guard/
          cargo build --release
      - uses: actions/checkout@v3
        name: Checkout aws-guard-rules-registry
        with:
          repository: aws-cloudformation/aws-guard-rules-registry
          path: aws-guard-rules-registry
          ref: main
      - name: Run integration tests using test command
        run: |
          if (cloudformation-guard/target/release/cfn-guard test -d aws-guard-rules-registry/rules) {
              echo "The integration tests for test command have passed."
          }
          else {
              echo "The integration tests for test command have failed."
              exit 1
          }

      - name: Run integration tests using parse-tree command
        run: |
          cd aws-guard-rules-registry/rules

          $FAILED_RULES = @()
          $SKIPPED_RULES = @()

          $rules  = @(Get-ChildItem -Path .\ -Filter *.guard -Recurse -File)

          Foreach ($rule in $rules) {
              $rule_files_without_comments = (Get-Content $rule.FullName) -replace '^[ \s]*#.*$', ''
              if ([String]::IsNullOrWhiteSpace($rule_files_without_comments)){
              $SKIPPED_RULES += "$rule"
          }
          elseif (../../cloudformation-guard/target/release/cfn-guard parse-tree --rules $rule.FullName) {
              continue
          } else {
              $FAILED_RULES += "$rule"
            }
          }

          $SKIPPED_RULE_COUNT = $SKIPPED_RULES.Length
          if ($SKIPPED_RULE_COUNT -gt 0) {
              echo "The following `$SKIPPED_RULE_COUNT.Length` rule(s) were skipped because they contained only comments:"
              echo $SKIPPED_RULES
          }

          $FAILED_RULE_COUNT = $FAILED_RULES.Length

          if ($FAILED_RULE_COUNT -gt 0) {
              echo "The following $FAILED_RULE_COUNT rule(s) have failed the parse-tree integration tests with a non-zero error code:"
              echo $FAILED_RULES
              exit 1
          } else {
              echo "All the rules have succeeded the parse-tree integration tests."
          }
