[package]
name = "cloudformation-guard-lang"
version = "3.2.1"
edition = "2018"
rust-version = "1.77.2"
description = "Parser, AST, and evaluation types for the AWS CloudFormation Guard DSL"
license = "Apache-2.0"
repository = "https://github.com/aws-cloudformation/cloudformation-guard"
readme = "README.md"

[dependencies]
nom = "7.0.0"
nom_locate = "4.0.0"
indexmap = { version = "1.6.0", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0.85", features = ["preserve_order"] }
serde_yaml = "0.9.10"
# Pin serde_json and serde_yaml's shared indexmap 2.x resolution to a release compatible with rust-version.
indexmap2-msrv = { package = "indexmap", version = "=2.11.4" }
fancy-regex = "0.13.0"
# The structural reading of a regex literal compared against a one-object map's keys is taken from the
# parsed syntax tree, so an anchor, a Unicode class and a POSIX class are read as what they are.
regex-syntax = "0.8.5"
thiserror = "1.0.38"
lazy_static = "1.4.0"
colored = "2.2.0"
unsafe-libyaml = "0.2.10"
chrono = "0.4.38"
cruet = "0.14.0"
urlencoding = "2.1.0"
quick-xml = { version = "0.30.0", optional = true }

[features]
junit = ["dep:quick-xml"]
# Record-equality for a dependent crate's tests: the evaluator offers no whole-record equality to
# ordinary consumers (a refusal token's count must not decide a `==`), and the CLI crate's tests
# compare records the way this crate's own tests do.
testing = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.92"

[dev-dependencies]
pretty_assertions = "1.4.0"
rstest = "0.24.0"
indoc = "1.0.8"
grep-searcher = "0.1.8"
grep-matcher = "0.1.5"
grep-regex = "0.1.9"
# The prefix scan in the evaluator's tests reads the crate's own sources as Rust, not as text.
syn = { version = "2.0.98", features = ["full", "visit"] }
proc-macro2 = { version = "1.0.93", features = ["span-locations"] }
