[default.extend-words]
# Don't correct "archtype" to "archetype"
archtype = "archtype"
# Don't flag ure in `FAIL`ure as a misspelling
ure = "ure"
# Don't flag dne as a misspelling
dne = "dne"
# Don't flag kms as mispelling
kms = "kms"
# Don't flag ource in regex patterns like /aws:[sS]ource.../
ource = "ource"
[default.extend-identifiers]
# Ignore ID in evaluate_tests.rs
fooCounterTaskDef49BA9021 = "fooCounterTaskDef49BA9021"
# A short SHA that ends in `ba`, which `typos` reads as `by`/`be`. Every prefix length flags,
# because the token sits between digits, so the commit cannot be cited in prose without this.
34d965ba = "34d965ba"
# `1ba4648d` carries `ba` at characters 2-3, so truncating does not help either -- and the commit
# that cites it is the one recording that a count needs the commit it was measured at attached.
1ba4648d = "1ba4648d"
[files]
extend-exclude = ["guard/ts-lib", "action"]
